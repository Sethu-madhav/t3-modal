[project]
name = "t3modal-controller"
version = "0.0.0"
description = "The t3modal controller, deployed to the user's Modal workspace."
requires-python = ">=3.12,<3.16"
dependencies = ["modal==1.6.4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
